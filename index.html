        <style>

/* 刷牙打怪兽：纯前端、无账号、无第三方依赖。数据仅保存在当前浏览器。 */
(() => {
  'use strict';

  const STORE_KEY = 'yaya-brush-monsters:v1';

        oscillator.frequency.setValueAtTime(frequency, t);

        gain.gain.exponentialRampToValueAtTime(volume,t+.025);
        gain.gain.exponentialRampToValueAtTime(.0001,t+length);
        oscillator.connect(gain);
        gain.connect(this.ctx.destination);
        oscillator.start(t);
        oscillator.stop(t+length+.02);
      } catch (_) { /* optional */ }
    },

    if (!s || view!=='game') return;
    const targetMs=s.durations[s.zoneIndex]*1000;
    const remain=Math.max(0,targetMs-s.elapsedMs);
    const before=s.durations.slice(0,s.zoneIndex).reduce((a,b)=>a+b,0)*1000;
    const total=progressDuration(s.durations)*1000;
    const percent=Math.min(100,(before+s.elapsedMs)/total*100);
    const hp=Math.max(0,Math.min(100,remain/targetMs*100));
    const seconds=root.querySelector('#secondsRemaining'); if(seconds) seconds.textContent=Math.ceil(remain/1000);
    const clock=root.querySelector('#totalClock'); if(clock) clock.textContent=clockText((total-before-s.elapsedMs)/1000);
    const bar=root.querySelector('#progressFill'); if(bar) bar.style.width=`${percent.toFixed(2)}%`;
    const hpBar=root.querySelector('#hpFill'); if(hpBar) hpBar.style.width=`${hp.toFixed(2)}%`;
    const totalEl=root.querySelector('#totalProgress'); if(totalEl) totalEl.setAttribute('aria-valuenow',Math.round(percent));
    const hpEl=root.querySelector('#hpProgress'); if(hpEl) hpEl.setAttribute('aria-valuenow',Math.round(hp));
    if(s.phase==='running' && remain<=10000 && warnedAtTen!==s.zoneIndex) {
      warnedAtTen=s.zoneIndex;
      setVoiceText('最后 10 秒！快把怪兽赶跑！');
      sound.say('最后十秒！快把怪兽赶跑！');
    }
  }
  function gameTick() {
    const s=data.session;
    if (!s || s.phase!=='running') return;
    const now=Date.now();
    s.elapsedMs+=Math.max(0,now-lastTick);
    lastTick=now;
    const limit=s.durations[s.zoneIndex]*1000;
    if (s.elapsedMs>=limit) {
      s.elapsedMs=limit;
      updateGameProgress();
      finishZone();
      return;
    }
    updateGameProgress();
    if (now-lastSaved>800) { saveData();lastSaved=now; }
  }
  function finishZone() {
    const s=data.session;
    if (!s || s.phase!=='running') return;
    sound.effect('pop');
    const monster=MONSTERS.find(m=>m.id===s.monsterId);
    if(monster && !data.unlocked.includes(monster.id)) data.unlocked.push(monster.id);
    const last=s.zoneIndex===3;
    if (last) {
      // 让最后一关也出现气泡效果，然后立即落盘奖励，避免刷新丢失。
      completeSession();
      return;
    }
    const arena=root.querySelector('#arena'); if(arena) arena.classList.add('defeat');
    const figure=root.querySelector('#monsterStage'); if(figure) figure.classList.add('defeated');
    const nextZone=s.zoneIndex+1;
    s.zoneIndex=nextZone; s.elapsedMs=0; s.monsterId=selectMonster(nextZone).id; s.phase='transition';
    setVoiceText('太棒啦！怪兽变成泡泡啦！');
    saveData();
    transitionTimer=window.setTimeout(() => {
      transitionTimer=null;
      if (!data.session || data.session.phase!=='transition') return;
      data.session.phase='running';
      lastTick=Date.now(); lastSaved=lastTick; warnedAtTen=-1;
      saveData(); renderGame();
      sound.say(`打败啦！接下来刷你的${ZONES[data.session.zoneIndex]}牙！${ZONE_GUIDES[data.session.zoneIndex]}`);
    }, 1050);
  }
  function completeSession() {
    const s=data.session;
    if (!s) return;
    const already=!!data.records[s.day]?.[s.slot];
    if (!data.records[s.day]) data.records[s.day]={};
    if (!already) data.records[s.day][s.slot]={at:new Date().toISOString(),seconds:progressDuration(s.durations)};
    const newMonsters=syncRareUnlocks();
    latestReward={newStar:!already,unlocked:newMonsters,slot:s.slot,duration:progressDuration(s.durations)};
    data.session=null;
    saveData();
    releaseWakeLock(); sound.stop(); sound.effect('win');
    view='victory'; renderVictory();
    sound.say(already?'又一次打败细菌怪兽！今天这一场的星星已经拿过了。':'太棒啦！四个地方都刷得亮晶晶！你得到一颗星星！');
  }
  async function requestWakeLock() {
    if (!('wakeLock' in navigator) || document.hidden) return;
    try { wakeLock=await navigator.wakeLock.request('screen'); }
    catch (_) { /* permission can be unavailable in browsers and local files */ }
  }
  function releaseWakeLock() {
    if(wakeLock) { try { wakeLock.release().catch(()=>{}); } catch (_) {} wakeLock=null; }
  }
  function pauseSession() {
    if (!data.session) return;
    if(data.session.phase==='running') gameTick();
    if (!data.session) return;
    if(transitionTimer) { clearTimeout(transitionTimer);transitionTimer=null; }
    data.session.phase='paused';
    saveData(); releaseWakeLock(); sound.stop();
    if (view==='game') renderGame();
  }
  function quitSession() {
    if (!data.session) return;
    if(!window.confirm('结束这次刷牙吗？没刷完就不会获得星星，已收集的怪兽会保留。')) return;
    if(transitionTimer) clearTimeout(transitionTimer);
    transitionTimer=null;
    data.session=null; saveData();releaseWakeLock();sound.stop();
    view='home';renderHome();
  }
  function renderVictory() {
    const r=latestReward || {newStar:true,unlocked:[],slot:selectedSlot,duration:progressDuration(data.settings.durations)};
    root.innerHTML=`${topbar({parent:true})}${errorBanner()}
      <main class="victory"><div class="star-dazzle" aria-hidden="true">${r.newStar?'🌟':'✨'}</div>
      <h1>${r.newStar?'哇！获得一颗星星！':'超级棒！又赢啦！'}</h1>
      <div class="victory-lead">四个地方都打扫干净啦！<br>${r.newStar?'你是今天的刷牙小英雄！':'这个时段的星星已领取，明天继续加油！'}</div>
      <div class="reward-card card"><div class="sec-heading"><span>我的刷牙战绩</span><small>${r.slot==='morning'?'☀️ 早安':'🌙 晚安'}</small></div>
        <div class="reward-stats"><div class="reward-stat"><strong>⭐ ${allStars()}</strong><small>累计星星</small></div><div class="reward-stat"><strong>🔥 ${currentStreak()}</strong><small>连续打卡天数</small></div></div>
        ${r.unlocked.length?`<div class="unlock-toast">🎁 新怪兽加入图鉴：${r.unlocked.map(m=>safeHTML(m.name)).join('、')}！</div>`:'<div class="unlock-toast">🫧 赶跑了四只细菌怪兽！打开图鉴看看它们吧。</div>'}
      </div>
      <button class="primary-btn" data-action="home">🏠 返回牙牙星球</button>
      <button class="secondary-btn" style="width:100%;margin-top:20px" data-action="collection">📖 打开我的怪兽图鉴</button>
      </main>`;
  }
  function renderCollection() {
    const next=nextUnlock();
    root.innerHTML=`${topbar({parent:true})}${errorBanner()}
      <h1 class="page-h">📖 怪兽图鉴</h1>
      <p class="page-sub">每赶跑一只怪兽，就能把它收进图鉴。坚持每天刷牙，还会遇到稀有怪兽！<br>已收集 <strong style="color:#506bd7">${data.unlocked.length}/${MONSTERS.length}</strong> ${next?`· 下一只要连续 ${next.need} 天`:'· 全部解锁啦！'}</p>
      <div class="collection-grid">${MONSTERS.map(m=>{
        const unlocked=data.unlocked.includes(m.id);
        return `<div class="monster-card ${unlocked?'':'locked'}" aria-label="${unlocked?m.name:'尚未解锁'}">
          ${monsterSVG(m,'album-svg')}
          <span class="rarity-pill ${m.rarity==='稀有'?'rare':m.rarity==='传说'?'legendary':''}">${m.rarity}</span>
          <div class="monster-name">${unlocked?m.name:'神秘怪兽'}</div>
          <div class="monster-requirement">${unlocked?'✓ 已收录':m.need ? `连续 ${m.need} 天解锁` : `刷完${ZONES[m.zone]}区域解锁`}</div>
        </div>`;
      }).join('')}</div>
      <button class="secondary-btn" data-action="home" style="width:100%;margin-top:16px">返回首页</button>`;
  }
  function attachGate() {
    const btn=root.querySelector('#parentGate');
    if(!btn) return;
    const cancel=()=>{ if(holdTimer) clearTimeout(holdTimer); holdTimer=null; btn.classList.remove('holding'); };
    btn.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      cancel();btn.classList.add('holding');
      holdTimer=window.setTimeout(()=>{ cancel();sound.stop();openGate(); },2200);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(type=>btn.addEventListener(type,cancel));
    btn.addEventListener('contextmenu',e=>e.preventDefault());
    btn.addEventListener('click',e=>e.preventDefault());
  }
  function openGate() {
    const options=[[7,8],[8,6],[9,7],[6,9],[8,9]];
    const pair=options[Math.floor(Math.random()*options.length)];
    question={a:pair[0],b:pair[1]};
    view='gate'; renderGate();
  }
  function renderGate(message='') {
    root.innerHTML=`${topbar({parent:true})}
      <main class="gate-page"><div class="gate-lock">👨‍👩‍👧‍👦</div><h1 class="page-h">家长专属入口</h1>
      <p class="page-sub">给大人出一道乘法题，答对才能查看记录和设置时间。</p>
      <div class="gate-form"><form id="gateForm"><label for="gateAnswer" style="display:block;color:#8998b2;font-size:13px;font-weight:900">请计算</label>
        <div class="gate-equation">${question.a} × ${question.b} = ?</div>
        <input class="gate-input" id="gateAnswer" type="number" pattern="[0-9]*" inputmode="numeric" required placeholder="答案" autocomplete="off" aria-label="家长验证乘法答案">
        <button class="primary-btn" type="submit" style="min-height:56px;font-size:17px">进入家长专区</button><div class="inline-note" id="gateError" aria-live="polite">${safeHTML(message)}</div>
      </form></div><button class="secondary-btn" data-action="home">返回游戏</button></main>`;
    root.querySelector('#gateForm').addEventListener('submit',e=>{
      e.preventDefault();
      if(Number(root.querySelector('#gateAnswer').value)===question.a*question.b) {view='parent';renderParent();}
      else { root.querySelector('#gateError').textContent='再检查一下答案哦。';root.querySelector('#gateAnswer').value=''; }
    });
  }
  function thirtyDays() {
    const date=new Date();date.setHours(12,0,0,0);
    return Array.from({length:30},(_,i)=>{const d=new Date(date);d.setDate(date.getDate()-i);return d;});
  }
  function renderParent() {
    const dates=thirtyDays();
    const total=dates.reduce((sum,d)=>sum+Number(!!data.records[dayKey(d)]?.morning)+Number(!!data.records[dayKey(d)]?.evening),0);
    const full=dates.filter(d=>data.records[dayKey(d)]?.morning && data.records[dayKey(d)]?.evening).length;
    const everyDay=dates.filter(d=>!!data.records[dayKey(d)]).length;
    root.innerHTML=`${topbar({parent:true})}${errorBanner()}
      <h1 class="page-h">👨‍👩‍👧 家长中心</h1>
      <p class="page-sub">刷牙记录只存在这台设备的当前浏览器中。</p>
      <div class="parent-banner">🌟 每天早上和晚上最多各得一颗星星；同一时段重复游戏不重复计分。每天完成至少一次算连续打卡一天。</div>
      <div class="parent-stats"><div class="parent-stat"><strong>${total}</strong><small>近30天刷牙次数</small></div><div class="parent-stat"><strong>${everyDay}</strong><small>有刷牙的天数</small></div><div class="parent-stat"><strong>${full}</strong><small>早晚都刷的天数</small></div></div>
      <section class="parent-block card"><h2>📅 最近 30 天</h2><p>✓ 代表该时段已完成；— 代表没有记录（不是实际刷牙检测）。</p>
        <div class="history-list" aria-label="最近30天早晚刷牙记录"><div class="history-row header"><span>日期</span><span>☀️ 早上</span><span>🌙 晚上</span></div>
        ${dates.map(d=>{const k=dayKey(d);const r=data.records[k]||{};const label=`${d.getMonth()+1}月${d.getDate()}日 ${'日一二三四五六'[d.getDay()]}`;
          return `<div class="history-row"><span>${label}</span><span>${r.morning?'<span class="check-yes">✓</span>':'<span class="check-no">—</span>'}</span><span>${r.evening?'<span class="check-yes">✓</span>':'<span class="check-no">—</span>'}</span></div>`;}).join('')}
        </div>
      </section>
      <section class="parent-block card"><h2>⏱ 调整每个区域的时长</h2><p>每个区域可设置 10～90 秒，每次加减 5 秒。下次开始的新游戏生效。</p>
        ${data.settings.durations.map((duration,i)=>`<div class="duration-row"><span class="duration-name">${i+1}. ${ZONES[i]}</span>
          <div class="duration-control"><button class="adjust-btn" data-action="adjust" data-index="${i}" data-step="-5" aria-label="缩短${ZONES[i]}时长" ${duration<=10?'disabled':''}>−</button>
          <span class="duration-value">${duration} 秒</span>
          <button class="adjust-btn" data-action="adjust" data-index="${i}" data-step="5" aria-label="增加${ZONES[i]}时长" ${duration>=90?'disabled':''}>+</button></div></div>`).join('')}
        <p style="margin:12px 0 0;text-align:right;font-weight:800;color:#566bc4">全程共 ${clockText(progressDuration(data.settings.durations))}</p>
        <div class="tools-row"><button class="secondary-btn" data-action="reset-durations">恢复每区30秒</button></div>
      </section>
      <section class="parent-block card"><h2>🗂 记录备份</h2><p>可把记录导出成 JSON 文件；更换浏览器或设备时，请手动导入备份。</p>
        <div class="tools-row"><button class="secondary-btn" data-action="export">⬇ 导出备份</button><button class="secondary-btn" data-action="import">⬆ 导入备份</button>
          <input type="file" id="importFile" accept="application/json,.json" hidden></div>
      </section>
      <p class="parent-disclaimer">本游戏是计时与动作提示工具，不能自动确认孩子是否真正刷牙。建议家长帮助小朋友使用含氟牙膏并监督刷牙。浏览器隐私模式、清除网站数据或换设备可能导致本地记录消失。</p>
      <button class="secondary-btn" data-action="home" style="width:100%;margin:15px 0 25px">完成，返回游戏</button>`;
    const input=root.querySelector('#importFile');
    input.addEventListener('change',async e=>{
      const file=e.target.files?.[0]; if(!file) return;
      try {
        if(file.size>2_000_000) throw Error('文件太大。');
        const parsed=JSON.parse(await file.text());
        if(parsed.version!==1 || !parsed.records || typeof parsed.records!=='object') throw Error('文件格式不正确。');
        if(!window.confirm('确认导入并替换这台设备当前的刷牙记录和设置吗？')) return;
        const restored=cleanData(parsed); restored.session=null;
        data=restored; saveData(); renderParent();
        window.alert('导入完成！');
      } catch(e) {window.alert(`导入失败：${e.message||'文件不可用'}`);}
    });
  }
  function exportRecords() {
    const backup={version:1,exportedAt:new Date().toISOString(),records:data.records,settings:data.settings,unlocked:data.unlocked};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`刷牙打怪兽_记录_${dayKey()}.json`;
    document.body.appendChild(a);a.click();a.remove();window.setTimeout(()=>URL.revokeObjectURL(url),2500);
  }
  function showScreen(next) {
    view=next;
    if(next==='home') renderHome();
    else if(next==='collection') renderCollection();
    else if(next==='parent') renderParent();
    else if(next==='game') renderGame();
  }
  root.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');
    if(!btn || btn.disabled) return;
    const action=btn.dataset.action;
    if(action==='home') { if(data.session && data.session.phase!=='paused') pauseSession();sound.stop();showScreen('home'); }
    else if(action==='start') beginSession();
    else if(action==='resume') resumeSession();
    else if(action==='pause') pauseSession();
    else if(action==='quit') quitSession();
    else if(action==='select-slot') { selectedSlot=btn.dataset.slot;renderHome(); }
    else if(action==='collection') { if(data.session?.phase==='running') pauseSession();sound.stop();showScreen('collection'); }
    else if(action==='sound') {
      data.settings.sound=!data.settings.sound;saveData();
      if(data.settings.sound) {sound.init();sound.play();if(data.session) sound.say(ZONE_GUIDES[data.session.zoneIndex]);}
      else sound.stop();
      if(view==='game') renderGame();
    }
    else if(action==='adjust') {
      const i=Number(btn.dataset.index),step=Number(btn.dataset.step);
      if(!Number.isInteger(i)||i<0||i>3||![-5,5].includes(step)) return;
      data.settings.durations[i]=Math.max(10,Math.min(90,data.settings.durations[i]+step));
      saveData();renderParent();
    }
    else if(action==='reset-durations') {data.settings.durations=[30,30,30,30];saveData();renderParent();}
    else if(action==='export') exportRecords();
    else if(action==='import') root.querySelector('#importFile')?.click();
  });
  window.addEventListener('pagehide',()=>{ if(data.session && data.session.phase!=='paused') pauseSession(); });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && data.session && data.session.phase!=='paused') pauseSession();
  });
  window.setInterval(gameTick,100);
  // 重载页面时仍保留当前区与已刷时间，但绝不把离开页面的时长算作刷牙时间。
  if (data.session) { data.session.phase='paused';saveData(); }
  syncRareUnlocks(); saveData();
  renderHome();
  // 单文件体验版没有 sw.js 或 PWA 清单；不要注册不存在的资源。
  // 需要离线安装能力时，请使用完整 PWA 工程。
})();

</script>
</body>
</html>
